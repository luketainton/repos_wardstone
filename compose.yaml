services:
  wardstone:
    build: .
    image: wardstone:local
    user: "${WARDSTONE_UID:-10001}:${WARDSTONE_GID:-10001}"
    ports:
      - "${WARDSTONE_BIND_ADDRESS:-127.0.0.1}:8443:8443"
    environment:
      WARDSTONE_ISSUER: "${WARDSTONE_ISSUER:-https://localhost:8443}"
      WARDSTONE_DATA_DIR: /data
      WARDSTONE_BOOTSTRAP_DIR: /bootstrap
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./bootstrap
        target: /bootstrap
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
