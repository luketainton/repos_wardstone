name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; leave empty for a dry run of the selected branch
        required: false
        default: ''
      publish:
        description: Publish artifacts and images (requires an existing version tag)
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Serialize publication, including tag and release events for the same version.
concurrency:
  group: wardstone-release
  cancel-in-progress: false

env:
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and check for a completed release
        id: plan
        env:
          RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: python3 scripts/release.py plan

      - name: Set up Go
        if: steps.plan.outputs.skip != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release source
        if: steps.plan.outputs.skip != 'true'
        run: |
          go mod verify
          make check
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build six binary archives and checksums
        if: steps.plan.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: python3 scripts/release.py build --tag "$RELEASE_TAG"

      - name: Set up Buildx
        if: steps.plan.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build container for HTTPS smoke test
        if: steps.plan.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: wardstone:release-check
          build-args: |
            VERSION=${{ steps.plan.outputs.tag }}
            COMMIT=${{ steps.plan.outputs.commit }}
            BUILD_DATE=${{ steps.plan.outputs.build_date }}

      - name: Verify release container
        if: steps.plan.outputs.skip != 'true'
        run: |
          docker run --rm --pull=never wardstone:release-check --version
          python3 scripts/container_smoke.py --image wardstone:release-check

      - name: Enable arm64 runtime build steps
        if: steps.plan.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Log in to Gitea Container Registry
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.registry_user != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ steps.plan.outputs.registry }}
          username: ${{ steps.plan.outputs.registry_user }}
          password: ${{ secrets.ACTIONS_TOKEN }}

      - name: Build multi-platform OCI image without publishing
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/wardstone-image.oci.tar
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}
          build-args: |
            VERSION=${{ steps.plan.outputs.tag }}
            COMMIT=${{ steps.plan.outputs.commit }}
            BUILD_DATE=${{ steps.plan.outputs.build_date }}

      - name: Publish multi-platform versioned image
        id: image
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}
          build-args: |
            VERSION=${{ steps.plan.outputs.tag }}
            COMMIT=${{ steps.plan.outputs.commit }}
            BUILD_DATE=${{ steps.plan.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.plan.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.commit }}
            org.opencontainers.image.created=${{ steps.plan.outputs.build_date }}

      - name: Attach artifacts and finish Gitea release
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_IMAGE: ${{ steps.plan.outputs.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --image "$RELEASE_IMAGE" --digest "$RELEASE_DIGEST"
